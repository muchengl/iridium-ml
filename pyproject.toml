[project]
name = "tracing-ml-dsl-demo"
version = "0.1.0"
description = "Minimal tracing ML DSL demo with toy MLIR emit/interpreter"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
examples = [
  "torch>=2.2",
  "torchvision>=0.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
